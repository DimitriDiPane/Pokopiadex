<script src="./js/json.js"></script>
<script src="./js/tools.js"></script>
<script>
    const pokopia = JSON.parse(pokopiastring);

    const pkmn = pokopia.pokemon;   

    fillListPkmn(pkmn);

    $("#search").change(function () {
        var val = $("#search").val();
        val = upperFirstChar(val);

        var items = pkmn.filter(p => p.nom.indexOf(val) !== -1);
        fillListPkmn(items);
    });


</script>
